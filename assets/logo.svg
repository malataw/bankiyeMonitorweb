<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Icon Mark -->
  <g transform="translate(6, 6)">
    <rect width="48" height="48" rx="14" fill="url(#logoGrad)"/>
    <!-- Outer Shield / Signal -->
    <path d="M24 10 L38 16 V27 C38 35 24 40 24 40 C24 40 10 35 10 27 V16 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Inner Pulse & Birr Dot -->
    <circle cx="24" cy="24" r="5" fill="url(#accentGrad)"/>
    <path d="M19 24 C19 21.2 21.2 19 24 19 C26.8 19 29 21.2 29 24" fill="none" stroke="#FDE047" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Text Label -->
  <text x="64" y="32" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="currentColor" letter-spacing="-0.5">
    Bankiye<tspan fill="#2563EB">Monitor</tspan>
  </text>
  <text x="65" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#10B981" letter-spacing="1.5">ETHIOPIAN FINTECH</text>
</svg>
